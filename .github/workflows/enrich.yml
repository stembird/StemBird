name: Scrape Enrich

# Schedules removed so this does not double-run with Vercel crons
# (enrich-jobs in vercel.json). Manual / admin dispatch still works.
# Career tips backfill (mode: tips) is disabled.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'scraped = re-normalize published scraped jobs from raw_data; sparse = active jobs missing fields (any intake)'
        required: false
        default: 'scraped'
        type: choice
        options:
          - scraped
          - sparse
      source_id:
        description: 'Optional: only this scraper source (scraped mode only)'
        required: false
        type: string
      limit:
        description: 'Batch size (default 10)'
        required: false
        default: '10'
        type: number

permissions:
  contents: read

concurrency:
  group: scrape-enrich
  cancel-in-progress: false

jobs:
  enrich:
    name: Enrich jobs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_USER_ID: ${{ secrets.SCRAPER_USER_ID }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_API_KEY_2: ${{ secrets.DEEPSEEK_API_KEY_2 }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enrich jobs
        env:
          MODE: ${{ github.event.inputs.mode }}
          SOURCE_ID: ${{ github.event.inputs.source_id }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          MODE="${MODE:-sparse}"
          ARGS="${MODE} ${LIMIT:-10}"
          if [ -n "$SOURCE_ID" ]; then ARGS="$ARGS $SOURCE_ID"; fi
          npm run worker:enrich -- $ARGS
