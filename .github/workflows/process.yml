name: Scrape Process

# Schedules removed so this does not double-run with Vercel crons
# (scrape-process in vercel.json). Manual / admin dispatch still works.
on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Optional: max queue items to process. Default 25.'
        required: false
        type: number

permissions:
  contents: read

concurrency:
  group: scrape-process
  cancel-in-progress: false

jobs:
  process:
    name: Process queue
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_USER_ID: ${{ secrets.SCRAPER_USER_ID }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_API_KEY_2: ${{ secrets.DEEPSEEK_API_KEY_2 }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      WORKER_PROCESS_BATCH: '25'
      WORKER_PROCESS_BUDGET_MS: '240000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Process queue
        run: |
          MAX="${{ github.event.inputs.max }}"
          if [ -n "$MAX" ]; then
            npm run worker:process "$MAX"
          else
            npm run worker:process
          fi
